name: Reliability

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python backend/scripts/verify_reliability.py

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [admin-panel, mobile/busguard]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
